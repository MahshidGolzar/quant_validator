name: Verify sanitizer coverage (scratch, to be deleted)

on:
  push:
    paths:
      - 'verify_sanitizer.cpp'
      - '.github/workflows/verify_sanitizer.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UBSan (GCC)
        run: |
          g++ -std=c++17 -g -fsanitize=undefined verify_sanitizer.cpp -o v_ubsan_gcc
          echo "--- running ---"
          ./v_ubsan_gcc; echo "exit=$?"
      - name: ASan (GCC)
        run: |
          g++ -std=c++17 -g -fsanitize=address verify_sanitizer.cpp -o v_asan
          echo "--- running ---"
          ./v_asan; echo "exit=$?"
      - name: UBSan (Clang)
        run: |
          clang++ -std=c++17 -g -fsanitize=undefined verify_sanitizer.cpp -o v_ubsan_clang
          echo "--- running ---"
          ./v_ubsan_clang; echo "exit=$?"
      - name: implicit-conversion (Clang)
        run: |
          clang++ -std=c++17 -g -fsanitize=implicit-conversion verify_sanitizer.cpp -o v_implicit
          echo "--- running ---"
          ./v_implicit; echo "exit=$?"
      - name: implicit-signed-integer-truncation specifically (Clang)
        run: |
          clang++ -std=c++17 -g -fsanitize=implicit-signed-integer-truncation verify_sanitizer.cpp -o v_trunc
          echo "--- running ---"
          ./v_trunc; echo "exit=$?"
